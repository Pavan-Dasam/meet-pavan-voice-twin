version: "3.8"

services:
  meet-pavan-voice-twin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meet_pavan_voice_twin
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-haiku-5-5}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-pavan-admin-secret-key-2026}
      - CHUNK_SIZE=800
      - CHUNK_OVERLAP=150
      - EMBEDDING_MODEL_NAME=all-MiniLM-L6-v2
      - TOP_K=5
      - MIN_SIMILARITY_SCORE=0.15
      - MAX_COSINE_DISTANCE=0.85
    volumes:
      - ./backend/data/chroma_db:/app/backend/data/chroma_db
      - ./backend/data/uploads:/app/backend/data/uploads
    restart: unless-stopped
